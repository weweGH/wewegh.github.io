<!--================Header Menu Area =================-->
{% assign base_path = include.base | default: '' %}
<header class="header_area{% if include.menu_class %} {{ include.menu_class }}{% endif %}">
    <div class="main_menu" id="mainNav">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container box_1620">
                <!-- Brand and toggle get grouped for better mobile display -->
                <a class="navbar-brand logo_h" href="{{ base_path }}index.html">
                    <img src="{{ base_path }}img/logo-gahyun_3.png" alt="Jeon GaHyun logo">
                    {% if include.alt_logo %}<img src="{{ base_path }}{{ include.alt_logo }}" alt="">{% endif %}
                </a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <!-- Collect the nav links, forms, and other content for toggling -->
                <div class="collapse navbar-collapse offset" id="navbarSupportedContent">
                    <ul class="nav navbar-nav menu_nav ml-auto">
                        <li class="nav-item active"><a class="nav-link" href="{{ base_path }}index.html">Home</a></li> 
                        <li class="nav-item"><a class="nav-link" href="{{ base_path }}index.html#projects">Projects</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ base_path }}index.html#experiments">Experiments</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ base_path }}index.html#blog">Blog</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ base_path }}index.html#contact">Contact</a></li>
                    </ul>
                </div> 
            </div>
        </nav>
    </div>
</header>
<!--================Header Menu Area =================-->
