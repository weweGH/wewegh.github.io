<!--================Header Menu Area =================-->
<header class="header_area{% if include.menu_class %} {{ include.menu_class }}{% endif %}">
    <div class="main_menu" id="mainNav">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container box_1620">
                <!-- Brand and toggle get grouped for better mobile display -->
                <a class="navbar-brand logo_h" href="{{ '/' | relative_url }}">
                    <img src="{{ '/img/logo-gahyun_3.png' | relative_url }}" alt="Jeon GaHyun logo">
                    {% if include.alt_logo %}<img src="{{ include.alt_logo | relative_url }}" alt="">{% endif %}
                </a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <!-- Collect the nav links, forms, and other content for toggling -->
                <div class="collapse navbar-collapse offset" id="navbarSupportedContent">
                    <ul class="nav navbar-nav menu_nav ml-auto">
                        <li class="nav-item active"><a class="nav-link" href="{{ '/' | relative_url }}">Home</a></li> 
                        <li class="nav-item"><a class="nav-link" href="{{ '/#projects' | relative_url }}">Projects</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ '/#experiments' | relative_url }}">Experiments</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ '/#blog' | relative_url }}">Blog</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ '/#contact' | relative_url }}">Contact</a></li>
                    </ul>
                </div> 
            </div>
        </nav>
    </div>
</header>
